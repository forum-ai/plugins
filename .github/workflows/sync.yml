# Rebuilds the catalog from members.json and each member's latest release, checks it, and
# commits any change. Runs daily, by hand (Actions → Sync → Run workflow), or when a member
# repository sends a "plugin-released" repository_dispatch event.
name: Sync

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [plugin-released]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild the catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/sync.py
      - name: Check the Claude catalog
        run: npx -y @anthropic-ai/claude-code@2.1.316 plugin validate .
      - name: Commit any change
        run: |
          git add -A
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync plugin versions"
          git push
